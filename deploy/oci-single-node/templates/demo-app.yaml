apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms-demo-app
  namespace: kms-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kms-demo-app
  template:
    metadata:
      labels:
        app: kms-demo-app
    spec:
      serviceAccountName: app-a
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ${DEMO_IMAGE}
        imagePullPolicy: Never
        env:
        - name: DEMO_TRANSIT_URL
          value: https://kms-transit.kube-system.svc.cluster.local:8200
        - name: DEMO_CA_FILE
          value: /ca/ca.crt
        - name: DEMO_TOKEN_FILE
          value: /transit/token
        - name: DEMO_PUBLIC_ORIGIN
          value: https://${DEMO_FQDN}:30443
        - name: DEMO_TLS_CERT
          value: /tls/tls.crt
        - name: DEMO_TLS_KEY
          value: /tls/tls.key
        ports:
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /readyz
            port: 8443
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: 8443
          initialDelaySeconds: 20
        volumeMounts:
        - name: ca
          mountPath: /ca
          readOnly: true
        - name: transit
          mountPath: /transit
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        command:
        - /usr/local/bin/demo-app
      volumes:
      - name: ca
        configMap:
          name: kms-internal-ca
      - name: transit
        projected:
          sources:
          - serviceAccountToken:
              audience: kms-system
              expirationSeconds: 3600
              path: token
      - name: tls
        secret:
          secretName: kms-demo-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kms-demo-app
  namespace: kms-demo
spec:
  type: NodePort
  selector:
    app: kms-demo-app
  ports:
  - name: https
    port: 8443
    targetPort: 8443
    nodePort: 30443
