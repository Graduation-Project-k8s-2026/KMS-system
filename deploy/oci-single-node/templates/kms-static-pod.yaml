apiVersion: v1
kind: Pod
metadata:
  name: kms-core
  namespace: kube-system
  labels:
    app: kms-core
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    # TPM 장치(/dev/tpmrm0)는 호스트에서 root:tss 0660이다(udev 규칙, docs/release/tpm-seal.md).
    # KMS는 uid/gid 10001이라 tss 그룹이 아니므로 보조 그룹으로 그 gid를 준다.
    # gid는 호스트마다 다르다: 렌더 입력 TPM_GROUP_GID (호스트에서 `getent group tss`).
    supplementalGroups:
    - ${TPM_GROUP_GID}
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: kms
    image: ${SERVER_IMAGE}
    imagePullPolicy: Never
    command:
    - /usr/local/bin/server
    env:
    - name: KMS_STORAGE
      value: file
    - name: KMS_DATA_DIR
      value: /data
    # 허용하는 봉인 방식. 실제 방식은 저장소의 init 기록이 정한다(KMS_SEAL_TYPE은 폐기).
    - name: KMS_SEAL_ALLOWED
      value: shamir,tpm
    # 서버가 장치를 여는 때는 "기록이 tpm일 때의 기동"과 "seal-migrate 요청" 두 경우뿐이다.
    # 그래서 Shamir만 쓰는 노드(장치 없음)에서도 이 값이 있어도 기동에 영향이 없다.
    - name: KMS_TPM_DEVICE
      value: /dev/tpmrm0
    # KMS_TPM_PCRS는 일부러 설정하지 않는다(PCR 봉인 꺼짐). 켜면 커널/펌웨어 업데이트 뒤
    # 자동 해제가 실패해 복구 조각이 필요해진다. 트레이드오프는 docs/decisions.md ADR-010 참고.
    - name: KMS_SHAMIR_PARTS
      value: '5'
    - name: KMS_SHAMIR_THRESHOLD
      value: '3'
    - name: KMS_AUTO_UNSEAL
      value: 'false'
    - name: KMS_ADMIN_SOCKET
      value: /run/kms-admin/admin.sock
    - name: KMS_V2_SOCKET
      value: /run/kms-v2/kms-v2.sock
    - name: KMS_V2_KEY_NAME
      value: k8s-secrets
    - name: KMS_TRANSIT_ADDR
      value: ${NODE_IP}:8200
    - name: KMS_TRANSIT_TLS_CERT
      value: /etc/transit-tls/tls.crt
    - name: KMS_TRANSIT_TLS_KEY
      value: /etc/transit-tls/tls.key
    - name: KMS_METRICS_ADDR
      value: 127.0.0.1:9100
    - name: KMS_AUTHN
      value: 'on'
    - name: KMS_AUTHZ
      value: 'on'
    - name: KMS_SA_PUBLIC_KEY
      value: /etc/kms-sa/sa.pub
    - name: KMS_SA_ISSUER
      value: ${SA_ISSUER}
    - name: KMS_SA_AUDIENCE
      value: kms-system
    - name: KMS_KUBECONFIG
      value: /etc/kms-sar/kms-sar.conf
    - name: KMS_AUTHZ_CACHE_TTL
      value: '10'
    - name: KMS_AUTHZ_TIMEOUT
      value: '3'
    - name: KMS_AUTHZ_FAIL_OPEN
      value: 'false'
    - name: KMS_AUDIT_DIR
      value: /core-audit
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    volumeMounts:
    - name: keys
      mountPath: /data
    - name: admin-socket
      mountPath: /run/kms-admin
    - name: v2-socket
      mountPath: /run/kms-v2
    - name: tls
      mountPath: /etc/transit-tls
      readOnly: true
    - name: sa-public
      mountPath: /etc/kms-sa/sa.pub
      readOnly: true
    - name: sar
      mountPath: /etc/kms-sar/kms-sar.conf
      readOnly: true
    - name: core-audit
      mountPath: /core-audit
    - name: tpm
      mountPath: /dev/tpmrm0
  volumes:
  - name: keys
    hostPath:
      path: /var/lib/custom-kms/keys
      type: Directory
  - name: admin-socket
    hostPath:
      path: /run/custom-kms/admin
      type: Directory
  - name: v2-socket
    hostPath:
      path: /run/custom-kms/kmsv2
      type: Directory
  - name: tls
    hostPath:
      path: /etc/custom-kms/transit-tls
      type: Directory
  - name: sa-public
    hostPath:
      path: /etc/custom-kms/sa.pub
      type: File
  - name: sar
    hostPath:
      path: /etc/custom-kms/kms-sar.conf
      type: File
  - name: core-audit
    hostPath:
      path: /var/lib/custom-kms/core-audit
      type: Directory
  # TPM 장치. 의도적으로 type을 지정하지 않는다(= kubelet이 사전 검사를 하지 않음).
  # type: CharDevice로 두면 장치가 없는 노드(TPM을 안 쓰는 Shamir 노드), 또는 swtpm이
  # 늦게 떠서 장치가 아직 없는 재부팅 직후에 이 Pod가 아예 시작되지 못한다. 그러면
  # KMS가 "봉인 상태로 기동해 복구 조각을 기다린다"는 복구 경로 자체를 잃는다.
  # 대신 장치가 필요한 시점(기록이 tpm일 때의 기동, seal-migrate)에만 서버가 열고, 못 열면
  # 원인을 밝히며 봉인을 유지한다. 주의: 일부 런타임은 없는 hostPath를 빈 디렉터리로 만든다
  # — TPM 노드에서는 kubelet이 swtpm 서비스 뒤에 뜨도록 순서를 강제한다(절차서 참고).
  - name: tpm
    hostPath:
      path: /dev/tpmrm0
  automountServiceAccountToken: false
