apiVersion: v1
kind: Pod
metadata:
  name: kms-core
  namespace: kube-system
  labels:
    app: kms-core
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: kms
    image: ${SERVER_IMAGE}
    imagePullPolicy: Never
    command:
    - /usr/local/bin/server
    env:
    - name: KMS_STORAGE
      value: file
    - name: KMS_DATA_DIR
      value: /data
    # 허용하는 봉인 방식. 실제 방식은 저장소의 init 기록이 정한다(KMS_SEAL_TYPE은 폐기).
    # TPM 봉인은 코드만 있고 배포 보류(ADR-010). 켜는 방법은 docs/release/tpm-seal.md
    - name: KMS_SEAL_ALLOWED
      value: shamir
    - name: KMS_SHAMIR_PARTS
      value: '5'
    - name: KMS_SHAMIR_THRESHOLD
      value: '3'
    - name: KMS_AUTO_UNSEAL
      value: 'false'
    - name: KMS_ADMIN_SOCKET
      value: /run/kms-admin/admin.sock
    - name: KMS_V2_SOCKET
      value: /run/kms-v2/kms-v2.sock
    - name: KMS_V2_KEY_NAME
      value: k8s-secrets
    - name: KMS_TRANSIT_ADDR
      value: ${NODE_IP}:8200
    - name: KMS_TRANSIT_TLS_CERT
      value: /etc/transit-tls/tls.crt
    - name: KMS_TRANSIT_TLS_KEY
      value: /etc/transit-tls/tls.key
    - name: KMS_METRICS_ADDR
      value: 127.0.0.1:9100
    - name: KMS_AUTHN
      value: 'on'
    - name: KMS_AUTHZ
      value: 'on'
    - name: KMS_SA_PUBLIC_KEY
      value: /etc/kms-sa/sa.pub
    - name: KMS_SA_ISSUER
      value: ${SA_ISSUER}
    - name: KMS_SA_AUDIENCE
      value: kms-system
    - name: KMS_KUBECONFIG
      value: /etc/kms-sar/kms-sar.conf
    - name: KMS_AUTHZ_CACHE_TTL
      value: '10'
    - name: KMS_AUTHZ_TIMEOUT
      value: '3'
    - name: KMS_AUTHZ_FAIL_OPEN
      value: 'false'
    - name: KMS_AUDIT_DIR
      value: /core-audit
    # Transit 요청 비동기 감사(키 이름·주체·결과 코드·지연; 본문/토큰/평문/암호문은 기록 안 함).
    # 비우면 꺼진다. 호스트 디렉터리는 미리 만들어 둬야 한다: install -d -o 10001 -g 10001 -m 0700 /var/lib/custom-kms/transit-audit
    - name: KMS_TRANSIT_AUDIT_DIR
      value: /transit-audit
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    volumeMounts:
    - name: keys
      mountPath: /data
    - name: admin-socket
      mountPath: /run/kms-admin
    - name: v2-socket
      mountPath: /run/kms-v2
    - name: tls
      mountPath: /etc/transit-tls
      readOnly: true
    - name: sa-public
      mountPath: /etc/kms-sa/sa.pub
      readOnly: true
    - name: sar
      mountPath: /etc/kms-sar/kms-sar.conf
      readOnly: true
    - name: core-audit
      mountPath: /core-audit
    - name: transit-audit
      mountPath: /transit-audit
  volumes:
  - name: keys
    hostPath:
      path: /var/lib/custom-kms/keys
      type: Directory
  - name: admin-socket
    hostPath:
      path: /run/custom-kms/admin
      type: Directory
  - name: v2-socket
    hostPath:
      path: /run/custom-kms/kmsv2
      type: Directory
  - name: tls
    hostPath:
      path: /etc/custom-kms/transit-tls
      type: Directory
  - name: sa-public
    hostPath:
      path: /etc/custom-kms/sa.pub
      type: File
  - name: sar
    hostPath:
      path: /etc/custom-kms/kms-sar.conf
      type: File
  - name: core-audit
    hostPath:
      path: /var/lib/custom-kms/core-audit
      type: Directory
  - name: transit-audit
    hostPath:
      path: /var/lib/custom-kms/transit-audit
      type: Directory
  automountServiceAccountToken: false
