# C+B 키 소유 모델(ADR-009): demo는 점이 없는 "클러스터 전역 키"다. 전역 키는 SAR을 namespace 없이
# 보내므로 네임스페이스 Role/RoleBinding은 효력이 없고 ClusterRole + ClusterRoleBinding으로만 허용된다.
# 이름 규칙은 scripts/migrate-rbac-cb.py와 같다: kms-cb-<키>-<verbs(알파벳순)>.
# 주체(app-a, bench-transit)와 권한(demo의 encrypt/decrypt/rewrap)은 이전과 같다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kms-cb-demo-decrypt-encrypt-rewrap
rules:
- apiGroups:
  - kms.local
  resources:
  - keys
  resourceNames:
  - demo
  verbs:
  - decrypt
  - encrypt
  - rewrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kms-cb-demo-decrypt-encrypt-rewrap
subjects:
- kind: ServiceAccount
  name: app-a
  namespace: kms-demo
- kind: ServiceAccount
  name: bench-transit
  namespace: kms-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kms-cb-demo-decrypt-encrypt-rewrap
---
apiVersion: rbac.authorization.k8s.io/v1
