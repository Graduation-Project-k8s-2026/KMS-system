apiVersion: v1
kind: Namespace
metadata:
  name: kms-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: kms-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: kms-bench
---
apiVersion: v1
kind: Namespace
metadata:
  name: kms-bench-plugin
---
apiVersion: v1
kind: Namespace
metadata:
  name: kms-bench-e2e
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kms-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kms-admin-pv
  labels:
    kms-volume: admin
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kms-local
  local:
    path: /var/lib/custom-kms/admin-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - ${NODE_NAME}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kms-admin-data
  namespace: kms-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: kms-local
  selector:
    matchLabels:
      kms-volume: admin
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kms-prometheus-pv
  labels:
    kms-volume: prometheus
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kms-local
  local:
    path: /var/lib/custom-kms/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - ${NODE_NAME}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kms-prometheus-data
  namespace: kms-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: kms-local
  selector:
    matchLabels:
      kms-volume: prometheus
  resources:
    requests:
      storage: 10Gi
