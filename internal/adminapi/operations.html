<!doctype html><html lang="ko"><meta charset="utf-8"><title>KMS 운영</title><style>body{font:16px system-ui;max-width:960px;margin:3rem auto;background:#111827;color:#e5e7eb}button,select{padding:.7rem;margin:.4rem}a{color:#93c5fd}pre{white-space:pre-wrap}article{border-top:1px solid #475569;padding:1rem}</style><h1>KMS 운영</h1><a href="/console">키·봉인 관리</a><p id="role"></p><select id="mode"><option>transit</option><option>plugin</option><option>e2e</option></select><button id="start">100회 왕복 시험</button><button id="refresh">새로고침</button><p id="status" role="status"></p><h2>작업</h2><div id="runs"></div><h2>최근 감사</h2><pre id="audit"></pre><h2>Prometheus</h2><pre id="metrics">N/A</pre><script>
let session;const $=id=>document.getElementById(id);async function request(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':session?.csrf_token||''},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.status===204?null:r.json()}
async function refresh(){try{session=await request('/api/session');$('role').textContent=session.role;$('start').disabled=session.role!=='admin';const runs=await request('/api/jobs');$('runs').replaceChildren();for(const r of runs){const a=document.createElement('article');a.textContent=`${r.run_id} · ${r.spec.mode} · ${r.state} · 결과 ${r.upload} `;const cancel=document.createElement('button');cancel.textContent='취소';cancel.disabled=session.role!=='admin'||!['queued','running'].includes(r.state);cancel.onclick=()=>request('/api/jobs/'+r.run_id,'DELETE').then(refresh).catch(show);a.append(cancel);if(r.upload==='stored'){const link=document.createElement('a');link.href='/api/bench/results/'+r.run_id;link.textContent='결과 JSON';a.append(link)}$('runs').append(a)}$('audit').textContent=JSON.stringify(await request('/api/audit'),null,2);const metrics={};for(const metric of ['targets','sealed','requests','last_unseal']){try{metrics[metric]=await request('/api/dashboard/metrics?metric='+metric)}catch{metrics[metric]='N/A'}}$('metrics').textContent=JSON.stringify(metrics,null,2)}catch(e){show(e)}}function show(e){$('status').textContent=e.message}
$('start').onclick=()=>request('/api/jobs','POST',{mode:$('mode').value,scenario:'basic',op:'roundtrip',count:100,concurrency:1,payload_bytes:1024,duration_seconds:0}).then(refresh).catch(show);$('refresh').onclick=refresh;refresh();
</script></html>
